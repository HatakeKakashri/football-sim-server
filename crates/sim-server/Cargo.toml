[package]
name = "sim-server"
version.workspace = true
edition.workspace = true

[dependencies]
sim-math = { path = "../sim-math" }
sim-components = { path = "../sim-components" }
sim-core = { path = "../sim-core" }
sim-replay = { path = "../sim-replay" }
sim-telemetry = { path = "../sim-telemetry" }
bevy_ecs.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"
bincode = "1"
serde.workspace = true
tracing.workspace = true
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util"] }

[[bin]]
name = "football-sim"
path = "src/main.rs"

[lints]
workspace = true