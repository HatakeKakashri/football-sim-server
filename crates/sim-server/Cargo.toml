[package]
name = "sim-server"
version.workspace = true
edition.workspace = true

[dependencies]
sim-math = { path = "../sim-math" }
sim-components = { path = "../sim-components" }
sim-core = { path = "../sim-core" }
sim-replay = { path = "../sim-replay" }
sim-telemetry = { path = "../sim-telemetry" }
bevy_ecs.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"
bincode = "1"
serde.workspace = true
sha2 = "0.10"
# Pure-Rust gzip backend only: the stored segment bytes must not depend
# on the platform's zlib version.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util"] }

[[bin]]
name = "football-sim"
path = "src/main.rs"

[lints]
workspace = true