# starters are deliberately out of position:
#   p-bravo-04 (listed 5th) starts at ML, trained [DC, DL] (fit distance 2 -> 0.75)
#   p-bravo-06 (listed 4th) starts at DC, trained [ML, AML] (fit distance 2 -> 0.75)
